# Render blueprint: one free web service, built from the Dockerfile.
#
# Why Render rather than a Hugging Face Space: creating a Gradio or Docker
# Space now requires a paid plan (PRO) - see DECISIONS.md. Render's free tier
# still serves a public URL from a container. The tradeoff is that a free
# service spins down when idle and the first request after that waits for a
# cold start, which is why the Season tab reads precomputed JSON and makes no
# model call: once the page is up, nothing else can be slow.
services:
  - type: web
    name: promo-finder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Set these in the Render dashboard, never in this file.
      - key: GEMINI_API_KEY
        sync: false
      # The failover provider from settings.yaml's `fallback` block. Without
      # it the failover is configured and dead: the router builds providers
      # lazily, so nothing complains at boot or in /api/health, and the cost
      # only lands when Gemini actually rate-limits - the run ends as
      # NoProviderAvailable instead of falling over. Free key at
      # console.groq.com. Optional: a run without it still works.
      - key: GROQ_API_KEY
        sync: false
      # The frontend's origin, for CORS. Not a secret, so it is written here
      # rather than left to the dashboard: declared, it shows up in the
      # service's Environment tab where it can be read and corrected, instead
      # of living only as a default inside api/main.py. Scheme-exact and
      # comma-separated - `http://` and `https://` are different origins, and
      # so are `example.com` and `www.example.com`.
      #
      # Editing it in the dashboard takes a restart, not a rebuild. Note that
      # re-syncing this blueprint will push this value back over a dashboard
      # edit, so a permanent change belongs here.
      # Both subdomains, because an allowlist is not a redirect: the old name
      # keeps working for anyone holding that link until it is taken down.
      - key: ALLOWED_ORIGINS
        value: https://kukupromofinder.byfrontage.com,https://promofinder.byfrontage.com
